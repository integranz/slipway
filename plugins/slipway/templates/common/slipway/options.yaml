# ADLC option registry — the single source of truth for what the intake interview offers.
#
# status values
#   implemented : selectable; templates exist and are exercised end to end
#   planned     : shown in the interview but NOT selectable yet (templates partial or plan-only)
#   later       : shown as roadmap only
#
# The interview must fail fast with a clear message when a user picks a non-implemented option.
# It must never silently fall back to another option or write a partial scaffold.
schema_version: 1

# Where the plugin is distributed from (rendered into target repos' .claude/settings.json)
distribution:
  marketplace: slipway-marketplace
  repo: integranz/slipway
  plugin: slipway

dimensions:
  cloud:
    question: Which cloud hosts the workloads?
    options:
      azure: { status: implemented, label: Microsoft Azure }
      aws:   { status: later,       label: Amazon Web Services }
      gcp:   { status: later,       label: Google Cloud }

  compute:
    question: Which compute service runs the containers?
    depends_on: cloud
    options:
      aca:         { status: implemented, cloud: azure, label: Azure Container Apps,
                     note: HTTPS ingress with TLS, Key Vault secret references, scale to zero, revisions }
      aci:         { status: planned,     cloud: azure, label: Azure Container Instances,
                     note: Terraform module written and plan-validated only. No TLS termination, no autoscaling, no Key Vault references; ACR pull needs a user-assigned identity }
      aks:         { status: later,       cloud: azure, label: Azure Kubernetes Service }
      app-service: { status: later,       cloud: azure, label: Azure App Service (containers) }

  registry:
    question: Which container registry stores the images?
    depends_on: cloud
    options:
      acr:  { status: implemented, cloud: azure, label: Azure Container Registry }
      ghcr: { status: later,       label: GitHub Container Registry }
      ecr:  { status: later,       cloud: aws,   label: Amazon ECR }
      gar:  { status: later,       cloud: gcp,   label: Google Artifact Registry }

  runner:
    question: Which CI/CD runner executes the pipelines?
    options:
      github-actions:  { status: implemented, label: GitHub Actions }
      azure-pipelines: { status: later,       label: Azure Pipelines }
      gitlab-ci:       { status: later,       label: GitLab CI }

  versioning:
    question: Which tool computes the release version and tags?
    options:
      nbgv:             { status: implemented, label: Nerdbank.GitVersioning,
                          note: version.json + git height; dotnet/nbgv GitHub Action; needs .NET SDK on the runner }
      semantic-release: { status: implemented, label: semantic-release,
                          note: "Conventional Commits; runs on the release branch in CI; creates tag and GitHub release; Node on the runner. Single-app repositories only: per-app tags in a monorepo are planned" }

  branching:
    question: Which branching strategy does the repo follow?
    options:
      trunk:   { status: implemented, label: Trunk-based (main + short-lived branches + PRs) }
      gitflow: { status: planned,     label: Gitflow (develop, release/*, hotfix/*),
                 note: branch rules and versioning branch config templated; not exercised end to end }

  tracker:
    question: Where is the work tracked?
    options:
      jira:         { status: implemented, label: Jira Cloud (Atlassian Rovo MCP Server; Standard plan or higher) }
      none:         { status: implemented, label: "No tracker: skills print 'tracking: disabled' and continue" }
      asana:        { status: later,       label: Asana }
      azure-devops: { status: later,       label: Azure DevOps Boards }

  secret_store:
    question: Where do runtime secrets live?
    depends_on: cloud
    options:
      azure-key-vault:     { status: implemented, cloud: azure, label: Azure Key Vault }
      aws-secrets-manager: { status: later,       cloud: aws,   label: AWS Secrets Manager }
      gcp-secret-manager:  { status: later,       cloud: gcp,   label: Google Secret Manager }

  base_image:
    question: Which base image family for the Dockerfiles?
    options:
      dhi:          { status: implemented, label: Docker Hardened Images (dhi.io, glibc, distroless runtime, -dev build variants) }
      mcr-chiseled: { status: planned,     label: Microsoft chiseled Ubuntu images (.NET fallback) }
      chainguard:   { status: later,       label: Chainguard (Wolfi) }
      alpine:       { status: later,       label: Alpine (musl) }

  cd_trigger:
    question: When does an app's CD workflow start?
    options:
      manual:        { status: implemented, label: "Manual: /slipway:deploy <app> <tag> <env> dispatches <prefix>-<app>-cd" }
      on-ci-success: { status: implemented, label: "Automatic: <prefix>-<app>-cd starts when <prefix>-<app>-ci succeeds on the default branch, targeting the CD environment; the environment approval gate still applies" }

  cd_approval:
    question: How is the GitHub environment approval given for a deployment?
    options:
      github-ui:  { status: implemented, label: "On the workflow run page in GitHub (Review deployments), by a required reviewer" }
      in-session: { status: implemented, label: "Also in the Claude Code session: after the plan summary, the agent approves the pending deployment through the GitHub API under the reviewer's own account, behind a forced permission prompt" }

  pr_checks:
    question: How does an app's CI behave on pull requests that do not touch that app?
    options:
      path-filtered:   { status: implemented, label: "Skip entirely (pure path filter). Do not make per-app checks required on the branch: a skipped workflow stays Pending and blocks the merge" }
      always-run-gate: { status: implemented, label: "Always start; a first gate job lists the changed files and skips the rest when the app is untouched (a skipped job counts as passed, so the checks can be required on the branch)" }

  stack:
    question: Which stack is each app built with? (asked per app)
    per_app: true
    options:
      dotnet8-api: { status: implemented, kinds: [api, worker],  label: .NET 8 (ASP.NET Core minimal API / worker) }
      react-vite:  { status: implemented, kinds: [frontend],     label: React + Vite static build served by nginx }
      node-ts-api: { status: planned,     kinds: [api, worker],  label: Node.js + TypeScript API, note: "curated hardened Dockerfile planned for 1.1; use stack custom meanwhile" }
      python-api:  { status: later,       kinds: [api, worker],  label: Python API }
      custom:      { status: implemented, kinds: [api, frontend, worker], label: "Bring your own Dockerfile at the app path (any language). slipway renders no image template and verifies what matters: the build honours VERSION/COMMIT, the health endpoint reports the version, the container runs as non-root; CI, CD, versioning, infra and tracking work unchanged" }

  config_store:
    question: Where do non-secret runtime settings live? (secrets always go to the secret store as Key Vault references)
    options:
      env:               { status: implemented, label: "Environment variables set by Terraform from apps[].env (simplest; a change creates a new revision)" }
      app-configuration: { status: later,       label: "Azure App Configuration (dynamic settings shared by many apps; needs the provider SDK in the app)" }

  database:
    question: Does slipway provision a database for apps that need one?
    options:
      none:                      { status: implemented, label: "No: the app receives its connection string from the secret store (you set the value)" }
      azure-postgresql-flexible: { status: planned,     label: "Azure Database for PostgreSQL Flexible Server in the foundation layer; connection string written to Key Vault by Terraform", note: "planned for 1.1; asked only when a database dependency is detected" }

app_kinds:
  api:      { label: HTTP API, ingress: external }
  frontend: { label: Browser frontend, ingress: external }
  worker:   { label: Background service, ingress: none }
