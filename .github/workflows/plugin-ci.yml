name: plugin-ci
on:
  pull_request:
  push:
    branches: [main, next]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Validate config example against schema
        run: npm run validate:config-example
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin and marketplace manifests
        run: npm run validate:plugin
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck -S warning plugins/slipway/hooks/*.sh plugins/slipway/scripts/*.sh scripts/release/*.sh
      - name: Shell syntax
        run: |
          shopt -s nullglob
          for f in scripts/**/*.sh plugins/slipway/hooks/*.sh plugins/slipway/scripts/*.sh; do bash -n "$f"; done
      - name: Release bump script self-test
        run: |
          tmp="$(mktemp)"; cp plugins/slipway/.claude-plugin/plugin.json "$tmp"
          PLUGIN_MANIFEST="$tmp" bash scripts/release/set-plugin-version.sh 9.9.9
          grep -q '"version": "9.9.9"' "$tmp"
      - name: Unit and integration tests (renderer, scaffold)
        run: npm run test:unit
      - name: Hook tests
        run: npm run test:hooks
