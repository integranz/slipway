# Human-triggered onboarding of a repository through a Cursor Cloud Agent (runbook: docs/CURSOR-ONBOARDING.md).
# Starts ONE cloud agent on the target repository with the prompt of scripts/onboard-prompt.sh; the agent installs the
# plugin, runs `/slipway:launch --yes --until bootstrap` and commits on a branch; Cursor opens the pull request.
# The agent receives no credential. This workflow needs the repository secret CURSOR_API_KEY (a Cursor team
# service-account key or a personal API key, cursor.com/dashboard -> API Keys); it is used only to call the API.
# Model: omitted by default (Cursor's user/team/system default); when that default is refused (invalid_model), a dry run
# lists the ids the key may use and the failure path prints them; pass -f model=<id>.
name: onboard
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository to onboard (owner/name)
        required: true
        type: string
      ref:
        description: Branch the agent starts from (its default branch)
        required: false
        default: main
        type: string
      answers:
        description: "Interview answers the agent may not guess, one `key: value` per line (azure.*, jira.*, options.*)"
        required: false
        default: ""
        type: string
      plugin_version:
        description: slipway version the agent installs (empty = the version of this checkout)
        required: false
        default: ""
        type: string
      model:
        description: "Cursor model id for the agent (GET /v1/models; empty = the account's default, which this account's API refused on 2026-09-27)"
        required: false
        default: claude-opus-5-5
        type: string
      dry_run:
        description: Print the request instead of calling the Cloud Agents API
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: onboard-${{ inputs.repository }}
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    outputs:
      agent_id: ${{ steps.start.outputs.agent_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the prompt
        id: prompt
        env:
          REPOSITORY: ${{ inputs.repository }}
          REF: ${{ inputs.ref }}
          ANSWERS: ${{ inputs.answers }}
          PLUGIN_VERSION: ${{ inputs.plugin_version }}
        run: |
          set -euo pipefail
          version="$PLUGIN_VERSION"
          [ -n "$version" ] || version="$(python3 -c 'import json; print(json.load(open("plugins/slipway/.claude-plugin/plugin.json"))["version"])')"
          args=(); if [ -n "$ANSWERS" ]; then printf '%s\n' "$ANSWERS" > answers.txt; args=(--answers answers.txt); fi
          bash scripts/onboard-prompt.sh "$REPOSITORY" --ref "$REF" --version "$version" "${args[@]}" > prompt.txt
          echo "version=$version" >> "$GITHUB_OUTPUT"
          { echo "## onboard $REPOSITORY"; echo; echo "- plugin version: $version"; echo "- start ref: $REF"; echo; echo "<details><summary>Prompt</summary>"; echo; echo '```'; cat prompt.txt; echo '```'; echo "</details>"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Build the request
        env:
          REPOSITORY: ${{ inputs.repository }}
          REF: ${{ inputs.ref }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          jq -n --rawfile text prompt.txt --arg url "https://github.com/$REPOSITORY" --arg ref "$REF" --arg model "$MODEL" \
            '{prompt: {text: $text}, repos: [{url: $url, startingRef: $ref}], autoCreatePR: true}
             + (if $model == "" then {} else {model: {id: $model}} end)' > request.json
          echo "request: $(jq -c 'del(.prompt)' request.json) + prompt ($(wc -c < prompt.txt) bytes)"
      - name: Dry run
        if: ${{ inputs.dry_run }}
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          echo "dry run: the request below was NOT sent"; jq '.prompt.text |= "<prompt, see the step summary>"' request.json
          # Models the key may pass as model.id (GET /v1/models is read-only). Omitting `model` uses the account's default,
          # which can be a model the API refuses (invalid_model, seen 2026-09-27): pick one of these with -f model=<id>.
          if [ -n "$CURSOR_API_KEY" ]; then
            if curl -sS -f -o models.json -u "$CURSOR_API_KEY:" https://api.cursor.com/v1/models; then
              echo "models available to this key (use -f model=<id>):"; jq -r '.items[] | "  \(.id)  \(.displayName // "")"' models.json
              { echo; echo "Models available to this key (\`-f model=<id>\`):"; jq -r '.items[] | "- \`\(.id)\` \(.displayName // "")"' models.json; } >> "$GITHUB_STEP_SUMMARY"
            else echo "::warning::GET /v1/models failed; the key may lack API access"; fi
          else echo "CURSOR_API_KEY is not set: models not listed"; fi
      - name: Start the cloud agent
        id: start
        if: ${{ !inputs.dry_run }}
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          REPOSITORY: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          [ -n "$CURSOR_API_KEY" ] || { echo "::error::repository secret CURSOR_API_KEY is not set (Cursor team service-account key or personal API key)"; exit 1; }
          code="$(curl -sS -o response.json -w '%{http_code}' -X POST https://api.cursor.com/v1/agents \
            -u "$CURSOR_API_KEY:" -H 'Content-Type: application/json' --data @request.json)"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Cloud Agents API answered HTTP $code"; jq . response.json 2>/dev/null || cat response.json
            if [ "$(jq -r '.error.code // empty' response.json 2>/dev/null)" = "invalid_model" ]; then
              # The account's default model is not usable through the API: list what is, so the retry is one command.
              if curl -sS -f -o models.json -u "$CURSOR_API_KEY:" https://api.cursor.com/v1/models; then
                echo "retry with one of these: -f model=<id>"; jq -r '.items[] | "  \(.id)  \(.displayName // "")"' models.json
                { echo; echo "**invalid_model**: retry with \`-f model=<id>\`, one of:"; jq -r '.items[] | "- \`\(.id)\` \(.displayName // "")"' models.json; } >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
            exit 1
          fi
          id="$(jq -r '.agent.id // .id // empty' response.json)"; url="$(jq -r '.agent.url // .url // empty' response.json)"
          [ -n "$url" ] || url="https://cursor.com/agents/$id"
          echo "agent $id started: $url"; echo "agent_id=$id" >> "$GITHUB_OUTPUT"
          { echo; echo "- agent: [$id]($url)"; echo "- the agent commits on \`slipway/onboard\`; Cursor pushes its branch and opens the pull request on $REPOSITORY"; } >> "$GITHUB_STEP_SUMMARY"

  # Annotates the pull request the agent produced: waits for the run to finish, reads the PR URL from the run's git
  # snapshot, and posts the human steps (setup-azure, secrets, environment, first approval) rendered from the branch's
  # .slipway/SETUP.md. Needs the repository secret ONBOARD_GITHUB_TOKEN: a fine-grained token with Pull requests: write,
  # Issues: write (labels), Contents: read and Metadata: read on the organisation's repositories. Without it the job
  # only reports the PR URL.
  annotate:
    needs: dispatch
    if: ${{ !inputs.dry_run && needs.dispatch.outputs.agent_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Wait for the agent run and find its pull request
        id: wait
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          AGENT_ID: ${{ needs.dispatch.outputs.agent_id }}
        run: |
          set -euo pipefail
          # Poll until the run ends and Cursor has opened the pull request (git.branches[].prUrl); after the run ends,
          # allow five more minutes for the PR to appear, then give up without failing (the transcript has the report).
          deadline=$((SECONDS + 60*60)); pr=""; status=""; ended_at=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            agent="$(curl -sS -u "$CURSOR_API_KEY:" "https://api.cursor.com/v1/agents/$AGENT_ID")"
            run_id="$(printf '%s' "$agent" | jq -r '.latestRunId // empty')"
            if [ -n "$run_id" ]; then
              run="$(curl -sS -u "$CURSOR_API_KEY:" "https://api.cursor.com/v1/agents/$AGENT_ID/runs/$run_id")"
              status="$(printf '%s' "$run" | jq -r '.status // empty')"
              pr="$(printf '%s' "$run" | jq -r '[.git.branches[]?.prUrl // empty][0] // empty')"
            fi
            [ -n "$pr" ] || pr="$(printf '%s' "$agent" | jq -r '[.git.branches[]?.prUrl // empty][0] // empty')"
            [ -z "$pr" ] || break
            case "$status" in
              FINISHED|ERROR|CANCELLED|EXPIRED) ended_at="${ended_at:-$SECONDS}"; [ $((SECONDS - ended_at)) -lt 300 ] || break;;
            esac
            sleep 30
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"; echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "agent $AGENT_ID run status: ${status:-unknown}; pull request: ${pr:-none}"
          { echo; echo "- run status: \`${status:-unknown}\`"; if [ -n "$pr" ]; then echo "- pull request: $pr"; else echo "- pull request: none found (the agent may have stopped with a report only; read the transcript)"; fi; } >> "$GITHUB_STEP_SUMMARY"
      - name: Comment the human steps on the pull request
        if: ${{ steps.wait.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ secrets.ONBOARD_GITHUB_TOKEN }}
          PR: ${{ steps.wait.outputs.pr }}
          AGENT_ID: ${{ needs.dispatch.outputs.agent_id }}
          REPOSITORY: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::warning::ONBOARD_GITHUB_TOKEN is not set: the pull request was found but not annotated ($PR)"; exit 0; }
          head="$(gh pr view "$PR" --json headRefName --jq .headRefName)"
          setup="$(gh api "repos/$REPOSITORY/contents/.slipway/SETUP.md?ref=$head" -H 'Accept: application/vnd.github.raw' 2>/dev/null || echo "(.slipway/SETUP.md not found on $head)")"
          {
            echo "## slipway onboarding — human steps before the first deployment"
            echo
            echo "This pull request was produced unattended by a Cursor Cloud Agent (https://cursor.com/agents/$AGENT_ID) started from the slipway onboarding workflow. Nothing in Azure, GitHub or Jira was created or changed by it."
            echo
            echo "1. Review and merge this pull request."
            echo "2. In **your** terminal, from the repository root on the default branch, run the Azure prerequisites (Entra app registration with federated credentials, resource groups, Terraform state storage, the \`AZURE_*\` repository secrets):"
            echo; echo '   ```'; echo '   bash .slipway/setup-azure.sh --apply --set-github-secrets'; echo '   ```'
            echo "3. Then run \`/slipway:launch\` in Claude Code or Cursor on a desktop: it resumes at the cloud and GitHub phases (environment with you as required reviewer, pull-request-only ruleset, foundation plan → your approval → apply) and continues into the first CI/CD run, which waits for your approval."
            echo
            echo "<details><summary><code>.slipway/SETUP.md</code> from this branch (every step, who does it, how)</summary>"; echo; echo "$setup"; echo; echo "</details>"
          } > comment.md
          gh pr comment "$PR" --body-file comment.md
          gh label create slipway-onboarding -R "$REPOSITORY" --description "Onboarding pull request produced by the slipway cloud dispatch" --color 0E8A16 2>/dev/null || true
          gh pr edit "$PR" --add-label slipway-onboarding || echo "::warning::could not add the label (token permissions?)"
          echo "- annotated: comment posted and label \`slipway-onboarding\` added" >> "$GITHUB_STEP_SUMMARY"
